<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Instagram Clone</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #fafafa;
    color: #262626;
  }

  /* ---------- Top Navbar ---------- */
  header {
    background: #fff;
    border-bottom: 1px solid #dbdbdb;
    padding: 12px 20px;
    display: flex;
    justify-content: center;
  }
  .navbar {
    width: 100%;
    max-width: 400px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .logo {
    font-family: 'Brush Script MT', cursive;
    font-size: 26px;
    font-weight: bold;
  }
  .nav-icons span {
    margin-left: 16px;
    font-size: 20px;
    cursor: pointer;
  }

  /* ---------- Stories ---------- */
  .stories {
    max-width: 400px;
    margin: 0 auto;
    background: #fff;
    display: flex;
    overflow-x: auto;
    padding: 12px 10px;
    border-bottom: 1px solid #dbdbdb;
  }
  .story {
    text-align: center;
    margin-right: 12px;
    flex-shrink: 0;
    width: 64px;
  }
  .story-ring {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(45deg, #feda75, #d62976, #4f5bd5);
    padding: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto;
  }
  .story-avatar {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: #ccc;
    border: 2px solid #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
  }
  .story p {
    font-size: 11px;
    margin-top: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ---------- Feed ---------- */
  .feed {
    max-width: 400px;
    margin: 0 auto;
    padding-bottom: 40px;
  }
  .post {
    background: #fff;
    border-bottom: 1px solid #dbdbdb;
    margin-bottom: 8px;
  }
  .post-header {
    display: flex;
    align-items: center;
    padding: 10px 12px;
  }
  .post-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #ccc;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    margin-right: 10px;
  }
  .post-username {
    font-weight: 600;
    font-size: 14px;
  }
  .post-image {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 40px;
    user-select: none;
  }
  .post-actions {
    display: flex;
    padding: 8px 12px 0 12px;
  }
  .post-actions span {
    font-size: 22px;
    margin-right: 14px;
    cursor: pointer;
  }
  .liked { color: #ed4956; }
  .post-likes {
    padding: 6px 12px 0 12px;
    font-weight: 600;
    font-size: 14px;
  }
  .post-caption {
    padding: 4px 12px 0 12px;
    font-size: 14px;
  }
  .post-caption b { margin-right: 6px; }
  .post-comment-box {
    display: flex;
    padding: 10px 12px;
    border-top: 1px solid #efefef;
    margin-top: 8px;
  }
  .post-comment-box input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 14px;
  }
  .post-comment-box button {
    border: none;
    background: none;
    color: #0095f6;
    font-weight: 600;
    cursor: pointer;
  }

  /* ---------- Bottom Nav ---------- */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #fff;
    border-top: 1px solid #dbdbdb;
    display: flex;
    justify-content: center;
  }
  .bottom-nav-inner {
    max-width: 400px;
    width: 100%;
    display: flex;
    justify-content: space-around;
    padding: 10px 0;
  }
  .bottom-nav-inner span { font-size: 22px; cursor: pointer; }
</style>
</head>
<body>

<header>
  <div class="navbar">
    <div class="logo">Instagram</div>
    <div class="nav-icons">
      <span>&#9825;</span>
      <span>&#9993;</span>
    </div>
  </div>
</header>

<div class="stories" id="stories"></div>

<div class="feed" id="feed"></div>

<div class="bottom-nav">
  <div class="bottom-nav-inner">
    <span>&#8962;</span>
    <span>&#128269;</span>
    <span>&#10133;</span>
    <span>&#9825;</span>
    <span>&#128100;</span>
  </div>
</div>

<script>
  // ---------- Sample data (in a real app this would come from a server/database) ----------
  const storyUsers = ["Your Story", "rahul", "sneha", "amit_k", "priya", "college_fest", "travel"];

  const posts = [
    { user: "rahul_23", emoji: "🌄", caption: "Sunrise from the hostel terrace", likes: 128 },
    { user: "sneha.codes", emoji: "💻", caption: "Finally finished my mini-project!", likes: 342 },
    { user: "campus_life", emoji: "🎉", caption: "College fest vibes", likes: 891 },
    { user: "amit_travels", emoji: "🏞️", caption: "Weekend trip to the hills", likes: 205 }
  ];

  // ---------- Render Stories ----------
  const storiesEl = document.getElementById("stories");
  storyUsers.forEach(name => {
    const div = document.createElement("div");
    div.className = "story";
    div.innerHTML = `
      <div class="story-ring">
        <div class="story-avatar">${name[0].toUpperCase()}</div>
      </div>
      <p>${name}</p>
    `;
    storiesEl.appendChild(div);
  });

  // ---------- Render Feed ----------
  const feedEl = document.getElementById("feed");

  posts.forEach((post, index) => {
    const postDiv = document.createElement("div");
    postDiv.className = "post";
    postDiv.innerHTML = `
      <div class="post-header">
        <div class="post-avatar">${post.user[0].toUpperCase()}</div>
        <div class="post-username">${post.user}</div>
      </div>
      <div class="post-image">${post.emoji}</div>
      <div class="post-actions">
        <span class="like-btn" data-index="${index}">&#9825;</span>
        <span>&#128172;</span>
        <span>&#9992;</span>
      </div>
      <div class="post-likes" id="likes-${index}">${post.likes} likes</div>
      <div class="post-caption"><b>${post.user}</b>${post.caption}</div>
      <div class="post-comment-box">
        <input type="text" placeholder="Add a comment..." id="comment-input-${index}">
        <button data-index="${index}" class="post-comment">Post</button>
      </div>
    `;
    feedEl.appendChild(postDiv);
  });

  // ---------- Like button behaviour ----------
  let likedPosts = {};
  document.querySelectorAll(".like-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const i = btn.dataset.index;
      const likesEl = document.getElementById(`likes-${i}`);
      let currentLikes = posts[i].likes;

      if (likedPosts[i]) {
        posts[i].likes = currentLikes - 1;
        btn.classList.remove("liked");
        btn.innerHTML = "&#9825;";
      } else {
        posts[i].likes = currentLikes + 1;
        btn.classList.add("liked");
        btn.innerHTML = "&#9829;";
      }
      likedPosts[i] = !likedPosts[i];
      likesEl.textContent = `${posts[i].likes} likes`;
    });
  });

  // ---------- Comment button behaviour ----------
  document.querySelectorAll(".post-comment").forEach(btn => {
    btn.addEventListener("click", () => {
      const i = btn.dataset.index;
      const input = document.getElementById(`comment-input-${i}`);
      if (input.value.trim() !== "") {
        alert(`Comment added: "${input.value}"`);
        input.value = "";
      }
    });
  });
</script>

</body>
</html>
